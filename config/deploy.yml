# Name of your application. Used to uniquely configure containers.
service: jomo_karuta_typing_rails_app

# Name of the container image (use your-user/app-name on external registries).
image: jomo_karuta_typing_rails_app

# Deploy to these servers.
servers:
  web:
    - 163.44.123.165

# kamal-proxy が Let's Encrypt の証明書を自動取得・更新して SSL 終端する。
# 前提: ドメインの A レコードがこのサーバーに向いていること
# （Rails 側の config.assume_ssl / config.force_ssl は production.rb で設定済み）。
proxy:
  ssl: true
  host: jomo-karuta-typing.n-daichi.dev

# Where you keep your container images.
# localhost:5555 は Kamal のローカルレジストリ機能。外部レジストリのアカウント不要で、
# デプロイ時に SSH トンネル経由でサーバーがイメージを pull する。
registry:
  server: localhost:5555

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - JOMO_KARUTA_TYPING_RAILS_APP_DATABASE_PASSWORD
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
    - ADMIN_EMAILS
  clear:
    # PostgreSQL accessory のコンテナ名。同一 Docker ネットワーク (kamal) 内で名前解決される。
    DB_HOST: jomo_karuta_typing_rails_app-db

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for local Active Storage files.
volumes:
  - 'jomo_karuta_typing_rails_app_storage:/rails/storage'

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
# Vite の本番出力先は public/vite（Propshaft の public/assets ではない）。
asset_path: /rails/public/vite

# Configure the image builder.
builder:
  arch: amd64

# VPS に root 以外のユーザーで SSH する場合は有効化する。
# ssh:
#   user: ubuntu

# アプリと同じサーバーに PostgreSQL を同居させる。
# アプリ DB と Solid Cable（対戦モードの pub/sub）を 1 台で兼ねる（ADR 0009）。
accessories:
  db:
    image: postgres:17
    host: 163.44.123.165 # servers.web と同じサーバー
    # ホストの 127.0.0.1 にのみ公開（SSH トンネル経由のデバッグ用）。
    # アプリコンテナからは Docker ネットワーク経由で直接 5432 に接続する。
    port: '127.0.0.1:5432:5432'
    env:
      clear:
        POSTGRES_USER: jomo_karuta_typing_rails_app
        POSTGRES_DB: jomo_karuta_typing_rails_app_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
